name: Publish Approved Public Events
on:
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-event-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test publication and cancellation matching
        run: python3 -m unittest discover -s test
      - name: Reconcile explicitly approved public events
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: python3 scripts/remove_cancelled_events.py
      - name: Publish verified changes
        run: |
          if git diff --quiet -- events.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.html
          git commit -m 'Sync explicitly approved public events'
          git push origin HEAD:main
