name: Publish Public Calendar Events
on:
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-event-cleanup
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-events.txt
      - name: Install ICS parser
        run: python -m pip install -r requirements-events.txt
      - name: Test public calendar rendering
        run: python -m unittest discover -s test
      - name: Read anonymous public calendar and generate page
        run: python scripts/calendar_feed.py
      - name: Publish verified changes
        run: |
          if git diff --quiet -- events.html calendar && test -z "$(git ls-files --others --exclude-standard calendar)"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.html calendar
          git commit -m 'Refresh public calendar events'
          git push origin HEAD:main
